resources:
  jobs:
    job_ventas_retail:
      name: "job_${var.project_name}"

      tasks:
        # 1) Crea catálogo, esquemas y Volume antes de correr el pipeline.
        - task_key: setup
          notebook_task:
            notebook_path: ../setup/00_setup.py
            base_parameters:
              catalog: ${var.catalog}
              project_name: ${var.project_name}
              landing_schema: ${var.landing_schema}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              volume_name: ${var.volume_name}

        # 2) Ejecuta el Declarative Pipeline (Bronze -> Silver -> Gold).
        - task_key: run_pipeline
          depends_on:
            - task_key: setup
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_ventas_retail.id}

      # Programación diaria (pausada por defecto; actívala manualmente si quieres
      # que corra sola). El pipeline igual puede lanzarse manualmente desde el Job.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Lima"
        pause_status: PAUSED

      email_notifications: {}
